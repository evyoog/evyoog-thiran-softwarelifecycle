# VYB-0904: what must pass before a pull request merges. Nothing here needs a real secret,
# a database, Docker, Keycloak or any external service: the backend unit tests are
# self-contained (mocks and in-process Spring contexts), and the integration runners are
# deliberately not run (see backend/README.md, "Running the integration runners locally").
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      # compile + unit tests (Surefire) + ArchUnit + package. Any failing test or compile error fails the job.
      - name: Build and test
        run: ./mvnw -B -ntp verify

  docs:
    name: Requirement docs are current
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # docs/02-requirements and test-cases/automated-tests-index.md are generated from
      # BUILD-REGISTER.md and the tests. Fails if someone changed one without regenerating.
      - name: Check generated docs
        run: python3 scripts/generate-requirements-docs.py --check

  frontend:
    name: Frontend type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npx tsc -b
      - name: Unit tests
        run: npm test
