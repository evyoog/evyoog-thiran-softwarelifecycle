# Forces docker-java (used by Testcontainers, see PostgresFixture) to request API 1.44
# directly instead of negotiating from its old default of 1.32. Needed because Docker
# Engine 29 rejects anything below 1.44 outright — see
# https://github.com/testcontainers/testcontainers-java/issues/11210. Remove this once
# the project upgrades to testcontainers-bom 2.x, which negotiates correctly on its own.
api.version=1.44
