spring:
  application:
    name: vyoog-api
  datasource:
    # Shared company RDS instance, Vyoog's own schema on it (see docs/DECISIONS.md D3).
    # The schema already exists: CREATE SCHEMA vyg_requirement AUTHORIZATION postgres.
    # D22 (accepted 2026-10-03, supersedes D9): NO credential has a real default here. DB_URL,
    # DB_USER and DB_PASSWORD come from the environment (local: .env + docker-compose;
    # deployed: the secrets manager). The defaults are deliberately empty, and
    # RequiredSecretsEnvironmentPostProcessor stops startup with a message naming the
    # missing variable, so an unset variable can never fall through to some database
    # the developer did not choose.
    # currentSchema must list both schemas, comma-separated (a real pgjdbc feature: it
    # becomes a `SET search_path` list) — `vyg_requirement` alone drops `public` from
    # the session's search_path entirely, breaking pgvector's `<=>` operator and
    # pg_trgm's operator classes, both registered unqualified in `public` by their
    # migrations. See BUILD-REGISTER.md Session 14 for the first time this bit us.
    # Example: jdbc:postgresql://localhost:5432/vygmicroservice?currentSchema=vyg_requirement,public
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      pool-name: vyoog-pool
  servlet:
    multipart:
      # VYB-0901: explicit limits instead of Spring's 1MB/10MB defaults. The request is
      # cut off here before it is buffered; AttachmentPolicy (vyoog.attachments.max-bytes,
      # the same 10 MiB) is the check the service itself enforces.
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false                      # non-negotiable
    properties:
      hibernate:
        default_schema: vyg_requirement
        jdbc.batch_size: 50
        order_inserts: true
    hibernate:
      ddl-auto: validate                     # Flyway owns the schema
  flyway:
    enabled: true
    schemas: vyg_requirement
    default-schema: vyg_requirement
    # Same connection as the app: this schema is owned by postgres, same as the
    # company's other apps (vyg-pms, the pricing tool) — there is no separate
    # non-owner/migrator role split here, unlike the original RLS design.
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Shared identity provider — same realm as vyg-pms and the pricing tool.
          issuer-uri: ${KEYCLOAK_ISSUER:https://user.evyoog.com/realms/eVyoog}
          jwk-set-uri: ${KEYCLOAK_JWKS:https://user.evyoog.com/realms/eVyoog/protocol/openid-connect/certs}
          # No audience check yet: the eVyoog realm has no audience mapper for this
          # app. Add one (client "vyoog-api") and an `audiences: vyoog-api` line here
          # once it exists — see docs/vyoog-getting-started.md.

vyoog:
  # VYB-0940: a network call (a model provider, object storage) made while a database transaction is open is logged
  # at ERROR and counted (network.calls.in-transaction) when 'warn'; the tests set 'fail', which refuses it.
  network-calls:
    in-transaction: ${NETWORK_CALLS_IN_TRANSACTION:warn}
  # VYB-0910: how long the bookkeeping tables keep rows before the nightly purge deletes them.
  # Both must be at least 1; the application refuses to start otherwise (0 would delete everything).
  # webhook-delivery-days is also the window in which a replayed, correctly signed webhook is refused:
  # the signed payload has no timestamp, the stored delivery id is the only replay protection.
  retention:
    idempotency-days: ${IDEMPOTENCY_RETENTION_DAYS:7}
    webhook-delivery-days: ${WEBHOOK_DELIVERY_RETENTION_DAYS:90}
    # VYB-0913: the connector sync log (one row per outbound connector operation; no payload, no secret).
    connector-sync-log-days: ${CONNECTOR_SYNC_LOG_RETENTION_DAYS:90}
  # VYB-0913: how outbound connector calls are made (see ConnectorExecutor / RetryPolicy). A call is
  # tried up to max-attempts times, waiting an exponentially growing, jittered delay between tries.
  connector:
    max-attempts: ${CONNECTOR_MAX_ATTEMPTS:4}
    initial-delay-ms: ${CONNECTOR_INITIAL_DELAY_MS:500}
    max-delay-ms: ${CONNECTOR_MAX_DELAY_MS:30000}
    request-timeout-ms: ${CONNECTOR_REQUEST_TIMEOUT_MS:10000}
  # CORS allowlist (comma-separated). No wildcard default: browsers send credentials
  # (the refresh-token cookie), so an origin is allowed only if it is listed here.
  # cors-allowed-origins matches exactly; cors-allowed-origin-patterns is for
  # local-dev hosts on any port (e.g. http://localhost:*) and is empty by default.
  # A bare `*` in either is refused at startup (see SecurityConfig).
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://devops.evyoog.com}
  cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  attachments:
    # VYB-0901: largest single upload, in bytes (10 MiB). Keep <= spring.servlet.multipart.max-file-size.
    max-bytes: ${ATTACHMENT_MAX_BYTES:10485760}
  bootstrap:
    # VYB-0901: one-time token POST /settings/bootstrap requires as X-Bootstrap-Token.
    # Empty (the default) switches the endpoint off. Set it only while bootstrapping a new
    # deployment, then unset it. Not a required secret.
    token: ${BOOTSTRAP_TOKEN:}
  jwt:
    # VYB-0908 (F09): the audience every access token must carry (its `aud` claim). Empty (the default)
    # disables the check and logs a warning at startup, because the shared eVyoog realm has no audience
    # mapper for this API yet (D6): setting it before that mapper exists would lock everyone out.
    # See docs/08-architecture/security/audience.md for the Keycloak steps, then set JWT_AUDIENCE.
    audience: ${JWT_AUDIENCE:}
  keycloak:
    # VYB-0048b: the username/password screen's server-side token exchange. The
    # secret lives ONLY in a backend env var — never in the frontend build, and (D22,
    # proposed; supersedes D20) never in this file either: the default is empty and
    # startup fails, naming KEYCLOAK_ROPC_CLIENT_SECRET, when it is unset. The client
    # is vyg-devops-ui, a dedicated confidential client (D21).
    token-uri: ${KEYCLOAK_TOKEN_URI:https://user.evyoog.com/realms/eVyoog/protocol/openid-connect/token}
    end-session-uri: ${KEYCLOAK_END_SESSION_URI:https://user.evyoog.com/realms/eVyoog/protocol/openid-connect/logout}
    ropc-client-id: ${KEYCLOAK_ROPC_CLIENT_ID:vyg-devops-ui}
    ropc-client-secret: ${KEYCLOAK_ROPC_CLIENT_SECRET:}
  auth:
    # VYB-0800: the refresh-token cookie AuthController sets. True everywhere real
    # (HTTPS) — the one reason to ever set AUTH_COOKIE_SECURE=false is a plain-HTTP
    # dev setup that isn't localhost/127.0.0.1 (browsers already special-case those
    # two as secure contexts, so this default works unchanged for local dev too).
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
  internal:
    # Cross-app SSO bridge (see AuthController/SsoBridgeSessionService). Every
    # OTHER backend in the mesh, comma-separated, no trailing slash on each —
    # used only for the backend-to-backend /internal/sso/* calls, never
    # exposed to a browser. eis-platform and vyg-pms have an /api
    # context-path; vyg-ticket does not.
    partner-backend-urls: ${VYOOG_SSO_PARTNER_BACKEND_URLS:http://localhost:8081/api,http://localhost:8080/api,http://localhost:8082}
    # Must match the identical value configured on every other app's own backend.
    # Required (D22): empty default, startup fails if unset.
    sso-shared-secret: ${INTERNAL_SSO_SHARED_SECRET:}
    # Unset locally (host-only "localhost" cookies already cross ports); set to
    # the real shared parent domain once this app's actual production
    # subdomain is confirmed alongside the other three.
    sso-cookie-domain: ${SSO_COOKIE_DOMAIN:}
    # The same shared "eVyoog" client already used above for this app's own
    # ROPC login (D8) — reused here as the impersonation broker for
    # cross-app exchange, same as it already is for eis-platform/vyg-pms/vyg-ticket.
    impersonation-client-id: ${KEYCLOAK_IMPERSONATION_CLIENT_ID:eVyoog}
    impersonation-client-secret: ${KEYCLOAK_IMPERSONATION_CLIENT_SECRET:}
  ai:
    # VYB-0666/0667: OpenAI Chat Completions for the multi-agent document analysis
    # pipeline (relevance triage, synthesis, grounding critique, and brief analysis —
    # the latter now also proposes import-candidate type) — same env var names
    # vyg-pms's own AiSuggestionService/ChatbotService already use (app.ai.* there),
    # so the same key value can be reused across both apps if that's what's actually
    # configured, without renaming anything. Disabled by default: each agent refuses
    # with a named reason rather than guessing when this is unset, same as every
    # other AI-unavailable path in this codebase.
    enabled: ${AI_ENABLED:false}
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    # VYB-0602: a real semantic EmbeddingProvider, swapped in for the local hashing
    # one purely by vyoog.ai.enabled — same on/off switch as the classifier/adjudicator
    # above, since all three use the same underlying OpenAI key.
    embeddings-url: ${AI_EMBEDDINGS_URL:https://api.openai.com/v1/embeddings}
    embeddings-model: ${AI_EMBEDDINGS_MODEL:text-embedding-3-small}
    # VYB-0667: the document-analysis agents read a whole section per call and write a
    # long description back, so they get their own timeout rather than the 20s the
    # per-statement classifiers use. A synthesis pass over a dense specification
    # legitimately runs longer than a type classification, and timing it out would be
    # indistinguishable from a provider outage in the error the user sees.
    analysis-timeout-seconds: ${AI_ANALYSIS_TIMEOUT_SECONDS:90}
    # VYB-0936: every model call goes through one gateway (com.vyoog.ai.ModelGateway). OpenAI is the first and, for
    # now, the only provider. A person waiting on a call gets two attempts inside interactive-deadline-seconds;
    # background work (a sweep, document analysis) gets up to four inside batch-deadline-seconds. A circuit breaker
    # per endpoint kind (chat, embeddings) stops calling after breaker-failure-threshold failed calls in a row, and
    # tries one call again after breaker-open-seconds.
    provider: ${AI_PROVIDER:openai}
    interactive-deadline-seconds: ${AI_INTERACTIVE_DEADLINE_SECONDS:25}
    batch-deadline-seconds: ${AI_BATCH_DEADLINE_SECONDS:300}
    breaker-failure-threshold: ${AI_BREAKER_FAILURE_THRESHOLD:5}
    breaker-open-seconds: ${AI_BREAKER_OPEN_SECONDS:60}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  # VYB-0784: metrics added to what was already exposed — request latency and JVM
  # figures come from Spring's own auto-instrumentation for free; DetectionTimer and
  # IntegrationHealthIndicator below are the two pieces this codebase adds itself.
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  # VYB-0784 (session 16): request-level tracing — sampled at 100% deliberately.
  # This is a small, non-production-traffic deployment; a real production rollout
  # would tune this down, but 100% is what makes "attribute a slow request to a
  # query" actually demonstrable rather than a coin-flip on whether this request
  # happened to be sampled.
  tracing.sampling.probability: 1.0

logging:
  level:
    com.vyoog: DEBUG
    org.hibernate.SQL: INFO
  # VYB-0784: makes the trace/span id Spring Boot's tracing autoconfiguration already
  # puts in the MDC actually visible in the console, explicitly, rather than trusting
  # a version-dependent default correlation pattern.
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{traceId:-},%X{spanId:-}] [%15.15t] %-40.40logger{39} : %m%n"
