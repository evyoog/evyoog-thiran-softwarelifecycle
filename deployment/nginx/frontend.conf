# Referenced by deployment/docker/frontend.Dockerfile ("COPY deployment/nginx/frontend.conf ...") but was
# missing from the repo entirely (no file, no git history) — meaning the production image
# built from this Dockerfile as committed cannot serve API calls at all: VITE_API_BASE
# defaults to the relative "/api/v1" (see .env / Dockerfile ARG), so the built JS calls
# same-origin `/api/v1/...` and relies on THIS file to reverse-proxy that to the real
# backend, exactly like vite.config.ts's dev-server `proxy: { '/api': ... }` does locally.
# Without it, a production nginx serving only static files either 404s on those paths or
# (with SPA-fallback rewriting) serves index.html for them — either way, no real JSON
# response comes back, so vyg-requirement-ui/src/shared/api/client.ts's res.json() throws
# a plain SyntaxError, which src/auth/AuthProvider.tsx's login() doesn't recognise as an
# ApiError and reports as the generic "Sign-in failed. Please try again." — with no hint
# of the real cause, since it never actually reached the backend.
#
# The backend host below matches the live VITE_API_PROXY_TARGET in .env
# (https://req-api.evyoog.com) — keep the two in sync if that ever changes.
# VYB-0909 (F33-F35): request limits. These zones must live at http level, which is where
# conf.d/*.conf is included.
#
# $binary_remote_addr is the address nginx sees. Behind a load balancer that is the balancer's
# address unless real_ip is configured, which would put every user in one bucket. Before relying
# on these in a deployment behind one, add to the server block below:
#     set_real_ip_from <the balancer's CIDR>;   real_ip_header X-Forwarded-For;   real_ip_recursive on;
# The rates are deliberately generous (a normal screen makes a handful of calls per second) so a
# shared address does not trip them; they exist to stop a runaway client or a password-guessing loop,
# not to meter users. The application has its own per-user limits (login, bulk edit, import).
limit_req_zone $binary_remote_addr zone=vyoog_api:10m rate=50r/s;
limit_req_zone $auth_limit_key     zone=vyoog_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=vyoog_conn:10m;

# An empty key is not counted, so only sign-in and token calls are charged to the stricter zone.
map $request_uri $auth_limit_key {
    ~^/api/v1/auth/  $binary_remote_addr;
    default          "";
}

server {
    # 8080, not 80: the image runs as the unprivileged nginx user, which cannot bind below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # VYB-0909 limits. 429 rather than the default 503 so a client can tell "slow down" from "down".
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn vyoog_conn 100;

    # Matches the API's own cap (spring.servlet.multipart.max-request-size: 12MB); anything larger
    # is refused here with 413 before it is buffered or proxied.
    client_max_body_size    12m;
    client_header_timeout   15s;
    client_body_timeout     30s;
    send_timeout            30s;
    keepalive_timeout       30s;

    # Proxied (not CORS'd): the browser only ever talks to this one origin, so the
    # HttpOnly refresh-token cookie AuthController sets (see AuthProvider.tsx) is set and
    # read on a single host with no cross-origin credentialed-fetch complications.
    location /api/ {
        limit_req zone=vyoog_api  burst=100 nodelay;
        limit_req zone=vyoog_auth burst=10  nodelay;

        proxy_pass https://req-api.evyoog.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host req-api.evyoog.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Longer than the slowest legitimate call: document analysis waits up to
        # AI_ANALYSIS_TIMEOUT_SECONDS (default 90) on the model.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    120s;
    }

    # The notification stream is meant to stay open for as long as the tab does (the API sets no
    # timeout on it), so it must not be buffered or cut by the 120s read timeout above.
    location = /api/v1/notifications/stream {
        limit_req zone=vyoog_api burst=20 nodelay;

        proxy_pass https://req-api.evyoog.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host req-api.evyoog.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout    1h;
    }

    # Liveness for the container healthcheck. Does not touch the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback — client-side routes (and the vyoog_sso hash hand-off AuthProvider.tsx
    # reads from window.location.hash) all resolve to the one index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
